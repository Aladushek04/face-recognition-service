
services:
  # Backend API server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env.docker.local
        required: false
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./.docker_data/data:/app/data
      - ./.docker_data/logs:/app/logs
      - ./.docker_data/jobs:/app/data/jobs
      - ${MODELS_DIR:-./.docker_data/models}:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
